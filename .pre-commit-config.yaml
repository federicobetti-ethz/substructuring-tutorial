repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry
        args: [run, black, --check]
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: poetry
        args: [run, ruff, check]
        language: system
        types: [python]
      - id: sphinx
        name: Build the documentation
        entry: poetry
        args: [run, sphinx-build, -W, -b, html, docs, docs/_build/html]
        language: system
        pass_filenames: false
        files: ^(docs/|substructuring/|scripts/|pyproject\.toml)
