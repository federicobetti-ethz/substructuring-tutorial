[project]
name = "substructuring-tutorial"
version = "0.1.0"
description = "Craig-Bampton and Rubin substructuring examples for a plane-stress cantilever."
authors = [
    {name = "federicobetti-ethz",email = "federico.betti@ibk.baug.ethz.ch"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy (>=2.5.5,<3.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "scikit-fem (>=12.0.2,<13.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
docs = [
    "sphinx (>=8.2,<9)",
    "furo (>=2025.12.19,<2026.0.0)"
]
